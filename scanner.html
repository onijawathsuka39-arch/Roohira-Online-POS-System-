<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wireless Barcode Scanner | Ruhira POS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff4b7d'/><text x='50' y='50' dominant-baseline='middle' text-anchor='middle' font-family='Outfit' font-weight='bold' font-size='50' fill='white'>R</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #ff4b7d;
            --primary-glow: rgba(255, 75, 125, 0.2);
            --bg: #0b0f19;
            --card-bg: #141b2d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box i {
            font-size: 20px;
            color: var(--primary);
        }

        .logo-box h2 {
            font-size: 16px;
            font-weight: 800;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .scanner-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        #reader {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--primary);
            background: #000;
            min-height: 240px;
            position: relative;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 12px;
        }

        .camera-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .manual-section {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border);
            padding: 14px;
            margin-top: 12px;
        }

        .manual-section h4 {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .manual-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--bg);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
            outline: none;
        }

        .manual-input:focus {
            border-color: var(--primary);
        }

        .history-section {
            width: 100%;
            max-width: 480px;
            margin-top: 14px;
        }

        .history-section h4 {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo-box">
            <i class="fas fa-qrcode"></i>
            <div>
                <h2>Phone Scanner</h2>
                <div style="font-size: 10px; color: var(--text-muted);">Syncing to POS Terminal</div>
            </div>
        </div>
        <div class="status-badge" id="statusBadge">
            <div class="status-dot"></div>
            <span>Connected</span>
        </div>
    </div>

    <div class="scanner-card">
        <div id="reader"></div>

        <div class="camera-controls">
            <button class="btn" id="btnToggleCamera" onclick="switchCamera()">
                <i class="fas fa-camera-rotate"></i> Switch Cam
            </button>
            <button class="btn" id="btnTorch" onclick="toggleTorch()">
                <i class="fas fa-bolt"></i> Flashlight
            </button>
        </div>
    </div>

    <div class="manual-section">
        <h4>Manual Code / Short Barcode Entry</h4>
        <div class="input-row">
            <input type="text" id="manualCode" placeholder="Enter short code e.g. 101, TS-01" class="manual-input" onkeydown="if(event.key==='Enter') sendManualCode()">
            <button class="btn btn-primary" style="flex: none; padding: 12px 20px;" onclick="sendManualCode()">
                <i class="fas fa-paper-plane"></i> SEND
            </button>
        </div>
    </div>

    <div class="history-section">
        <h4>Recent Scans Sent to POS</h4>
        <div class="history-list" id="historyList">
            <div style="text-align: center; color: var(--text-muted); padding: 16px; font-size: 12px; font-weight: 600;">
                No scans yet. Point phone camera at product barcode!
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Scanned Code Sent!</div>

    <script>
        let html5QrCode = null;
        let isScanning = false;
        let currentFacingMode = "environment";
        let isTorchOn = false;
        let audioCtx = null;

        document.addEventListener('DOMContentLoaded', () => {
            initScanner();
        });

        function playBeepSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}

            if (navigator.vibrate) {
                try { navigator.vibrate(80); } catch(e) {}
            }
        }

        async function initScanner() {
            try {
                html5QrCode = new Html5Qrcode("reader");
                const config = {
                    fps: 15,
                    qrbox: { width: 250, height: 180 },
                    aspectRatio: 1.333333
                };

                await html5QrCode.start(
                    { facingMode: currentFacingMode },
                    config,
                    onScanSuccess,
                    onScanError
                );
                isScanning = true;
            } catch (err) {
                console.warn("Html5Qrcode start error:", err);
                document.getElementById('reader').innerHTML = `
                    <div style="padding: 30px; text-align: center; color: var(--text-muted);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 36px; color: var(--primary); margin-bottom: 10px;"></i>
                        <div>Camera access required for barcode scanning.</div>
                        <div style="font-size: 11px; margin-top: 6px;">You can still use Manual Code Entry below!</div>
                    </div>
                `;
            }
        }

        let lastScannedCode = '';
        let lastScanTime = 0;

        function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            if (decodedText === lastScannedCode && (now - lastScanTime) < 2000) {
                return; // Prevent duplicate trigger within 2 seconds
            }

            lastScannedCode = decodedText;
            lastScanTime = now;

            playBeepSound();
            sendBarcodeToPOS(decodedText);
        }

        function onScanError(errorMessage) {
            // Ignore repetitive scan errors
        }

        async function switchCamera() {
            if (!html5QrCode) return;
            try {
                await html5QrCode.stop();
                currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                initScanner();
            } catch (e) {
                console.error(e);
            }
        }

        async function toggleTorch() {
            if (!html5QrCode || !isScanning) return;
            try {
                isTorchOn = !isTorchOn;
                await html5QrCode.applyVideoConstraints({
                    advanced: [{ torch: isTorchOn }]
                });
            } catch (e) {
                alert("Flashlight not supported on this camera/browser.");
            }
        }

        function sendManualCode() {
            const input = document.getElementById('manualCode');
            const code = input.value.trim();
            if (!code) return;
            playBeepSound();
            sendBarcodeToPOS(code);
            input.value = '';
        }

        async function sendBarcodeToPOS(barcodeStr) {
            showToast(`Scanned: ${barcodeStr}`);
            addToHistory(barcodeStr);

            try {
                const res = await fetch('/api/scanner/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode: barcodeStr })
                });
                const data = await res.json();
                if (data.success) {
                    console.log("Barcode synced to POS successfully:", barcodeStr);
                }
            } catch (err) {
                console.error("Failed to post barcode to POS server:", err);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function addToHistory(code) {
            const historyList = document.getElementById('historyList');
            if (historyList.children.length === 1 && historyList.children[0].textContent.includes('No scans yet')) {
                historyList.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            item.innerHTML = `
                <div>
                    <span style="color: var(--primary);"><i class="fas fa-barcode"></i></span>
                    <span style="margin-left: 6px;">${code}</span>
                </div>
                <div style="font-size: 10px; color: var(--success); font-weight: 700;">
                    ${timeStr} <i class="fas fa-check-circle" style="margin-left: 2px;"></i>
                </div>
            `;

            historyList.insertBefore(item, historyList.firstChild);
            if (historyList.children.length > 5) {
                historyList.removeChild(historyList.lastChild);
            }
        }
    </script>
</body>
</html>
